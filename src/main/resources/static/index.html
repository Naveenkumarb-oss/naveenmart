<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaveenMart</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#172337}header{background:#2874f0;color:#fff;padding:15px 5%;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.logo{font-size:27px;font-weight:900}.logo span{color:#ffe500}.search{flex:1;min-width:220px;max-width:600px;padding:12px 15px;border:0;border-radius:5px}.nav{display:flex;gap:8px;align-items:center}.btn{padding:10px 14px;border:0;border-radius:5px;background:#2874f0;color:#fff;cursor:pointer;font-weight:700}.light{background:#fff;color:#2874f0}.danger{background:#d32f2f}.container{width:min(1200px,92%);margin:22px auto}.hero{background:linear-gradient(110deg,#172337,#2874f0);color:white;border-radius:10px;padding:34px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:38px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card,.panel{background:#fff;border-radius:9px;box-shadow:0 2px 12px #ddd}.card{overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.content{padding:16px}.category{font-size:12px;color:#2874f0;font-weight:800;text-transform:uppercase}.price{font-size:22px;font-weight:900;margin:8px 0}.stock{color:#388e3c;font-size:13px}.desc{color:#666;min-height:40px}.panel{padding:20px;margin-top:22px}.hidden{display:none!important}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea,.form select{padding:11px;border:1px solid #ddd;border-radius:5px;width:100%}.form textarea{grid-column:1/-1;height:80px}.form button{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.box{background:white;border-radius:10px;padding:24px;width:min(460px,100%)}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.notice{text-align:center;padding:10px;margin:8px 0}.userbar{display:flex;gap:8px;align-items:center}.small{font-size:13px;color:#666}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:600px){.form{grid-template-columns:1fr}.hero h1{font-size:28px}.table{font-size:12px}}
</style></head><body>
<header><div class="logo">NAVEEN<span>MART</span></div><input id="search" class="search" placeholder="Search products..." oninput="render()"><div id="nav" class="nav"></div></header>
<main class="container"><section class="hero"><h1>Shop Smart. Shop Simple.</h1><p>Java 17 + Spring Boot + MySQL e-commerce application.</p></section><div id="status" class="notice"></div><section><div class="toolbar"><h2>Products <span id="count"></span></h2><select id="category" onchange="render()"><option value="all">All categories</option></select></div><div id="grid" class="grid"></div></section><section id="adminPanel" class="panel hidden"><h2>Admin Product Management</h2><p class="small">Only Admin can add or delete products.</p><form id="productForm" class="form"><input id="pname" placeholder="Product name" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required><input id="quantity" type="number" min="0" placeholder="Quantity" required><input id="cat" placeholder="Category" required><input id="imageUrl" placeholder="Image URL"><textarea id="description" placeholder="Product description"></textarea><button class="btn" type="submit">Add Product</button></form><h3>Registered Users</h3><div id="users"></div></section><section id="profilePanel" class="panel hidden"><h2>My Account</h2><form id="profileForm" class="form"><input id="fullName" placeholder="Full name" required><input id="phone" placeholder="Phone"><input id="address" placeholder="Address"><input id="email" disabled><button class="btn" type="submit">Update Details</button></form></section></main>
<div id="authModal" class="modal hidden"><div class="box"><div class="tabs"><button class="btn" onclick="showAuth('login')">Login</button><button class="btn light" onclick="showAuth('register')">Register</button></div><form id="authForm" class="form"><div id="nameWrap"><input id="regName" placeholder="Full name"></div><input id="authEmail" type="email" placeholder="Email" required><input id="authPassword" type="password" placeholder="Password" required><div id="extraWrap"><input id="regPhone" placeholder="Phone"><input id="regAddress" placeholder="Address"></div><button class="btn" type="submit">Login</button><button type="button" class="btn light" onclick="closeAuth()">Cancel</button></form><p class="small">Demo Admin: admin@naveenmart.com / admin123<br>Demo Customer: customer@naveenmart.com / customer123</p></div></div>
<script>
let products=[],me=null,authMode='login';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function status(t,error=false){$('status').textContent=t;$('status').style.color=error?'#d32f2f':'#388e3c'}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d}
async function load(){try{products=await api('/api/products');fillCats();render();await session();}catch(e){status(e.message,true)}}
async function session(){try{me=await api('/api/auth/me')}catch(e){me=null}renderNav();if(me){fillProfile();$('profilePanel').classList.remove('hidden');if(me.role==='ADMIN'){ $('adminPanel').classList.remove('hidden');loadUsers();}}}
function renderNav(){ $('nav').innerHTML=me?`<div class="userbar"><b>${esc(me.fullName)}</b><button class="btn light" onclick="toggleProfile()">Account</button>${me.role==='ADMIN'?'<button class="btn light" onclick="toggleAdmin()">Admin</button>':''}<button class="btn danger" onclick="logout()">Logout</button></div>`:`<button class="btn light" onclick="openAuth('login')">Login</button><button class="btn" onclick="openAuth('register')">Register</button>` }
function fillCats(){let cats=[...new Set(products.map(p=>p.category))].sort();$('category').innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('')}
function render(){let q=$('search').value.toLowerCase(),c=$('category').value;let list=products.filter(p=>(c==='all'||p.category===c)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(q));$('count').textContent=`(${list.length})`;$('grid').innerHTML=list.length?list.map(p=>`<article class="card">${p.imageUrl?`<img src="${esc(p.imageUrl)}" onerror="this.style.display='none'">`:''}<div class="content"><div class="category">${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="stock">${p.quantity>0?'In stock: '+p.quantity:'Out of stock'}</div><p class="desc">${esc(p.description)}</p>${me?`<button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>`:''}${me&&me.role==='ADMIN'?` <button class="btn danger" onclick="removeProduct(${p.id})">Delete</button>`:''}</div></article>`).join(''):'<div class="panel">No products found.</div>'}
function openAuth(m){authMode=m;showAuth(m);$('authModal').classList.remove('hidden')}function closeAuth(){$('authModal').classList.add('hidden')}function showAuth(m){authMode=m;$('nameWrap').classList.toggle('hidden',m==='login');$('extraWrap').classList.toggle('hidden',m==='login');$('authForm').querySelector('button[type=submit]').textContent=m==='login'?'Login':'Create Account'}
$('authForm').onsubmit=async e=>{e.preventDefault();try{let body={email:$('authEmail').value,password:$('authPassword').value};if(authMode==='register')Object.assign(body,{fullName:$('regName').value,phone:$('regPhone').value,address:$('regAddress').value});me=await api('/api/auth/'+authMode,{method:'POST',body:JSON.stringify(body)});closeAuth();await load();status('Welcome, '+me.fullName)}catch(e){status(e.message,true)}};
async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;$('profilePanel').classList.add('hidden');$('adminPanel').classList.add('hidden');renderNav();render();status('Logged out')}
function fillProfile(){$('fullName').value=me.fullName;$('email').value=me.email;$('phone').value=me.phone;$('address').value=me.address}function toggleProfile(){$('profilePanel').classList.toggle('hidden')}function toggleAdmin(){$('adminPanel').classList.toggle('hidden')}
$('profileForm').onsubmit=async e=>{e.preventDefault();try{me=await api('/api/auth/me',{method:'PUT',body:JSON.stringify({fullName:$('fullName').value,phone:$('phone').value,address:$('address').value})});fillProfile();renderNav();status('Account details updated')}catch(e){status(e.message,true)}};
$('productForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pname').value,price:Number($('price').value),quantity:Number($('quantity').value),category:$('cat').value,description:$('description').value,imageUrl:$('imageUrl').value})});e.target.reset();await load();status('Product added')}catch(e){status(e.message,true)}};
async function removeProduct(id){if(!confirm('Delete this product?'))return;try{await api('/api/products/'+id,{method:'DELETE'});await load();status('Product deleted')}catch(e){status(e.message,true)}}
async function loadUsers(){if(me?.role!=='ADMIN')return;try{let u=await api('/api/auth/users');$('users').innerHTML='<table class="table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr>'+u.map(x=>`<tr><td>${esc(x.fullName)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.role)}</td></tr>`).join('')+'</table>'}catch(e){}}
function addToCart(id){alert('Cart API is prepared for the next module. Product ID: '+id)}
showAuth('login');load();
</script></body></html>
