services:
  mysql:
    image: mysql:8.4
    container_name: naveenmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: naveen_mart
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: naveenmart-app
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/naveen_mart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: admin
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql_data:
